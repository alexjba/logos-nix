name: Windows cache prime

# Fills the shared Logos binary cache with the mingw closure that every Windows
# CI job depends on. THIS IS A PREREQUISITE, NOT AN OPTIMISATION.
#
# WHY THIS FILE IS STILL IN logos-nix when the rest of the Windows CI harness
# moved to logos-co/logos-windows-ci: it is the one piece genuinely bound to the
# OVERLAY rather than to the harness. Its `push: paths:` trigger below watches
# `flake.lock` and `nix/windows/**` -- this repo's own files -- and no external
# repo can express that. The builds it runs are one-token flakerefs and would
# move happily; the trigger is what cannot.
#
# The cache itself is now the org's self-hosted Attic (cache.nix.logos.co, per
# status-im/infra-ci#263) rather than a cachix cache of our own, reached through
# logos-windows-ci's nix-setup. The 404 measurements below were taken against
# logos-co.cachix.org and have NOT been re-run against Attic -- treat the
# specific store paths as illustrative of the shape of the problem (nixpkgs'
# Hydra does not build cross Qt, so nobody upstream fills it) rather than as
# current facts about what the Attic cache holds.
#
# THE MEASUREMENT THAT MAKES IT ONE
#   The mingw *toolchain* substitutes from cache.nixos.org (200 on
#   x86_64-w64-mingw32-gcc-wrapper-15.2.0). The mingw *Qt* stack does not, in
#   either cache: qtbase, qtdeclarative, qtsvg and qtremoteobjects at 6.11.1,
#   plus icu4c 76.1 and boost 1.89.0, were all probed 404 on BOTH
#   logos-co.cachix.org and cache.nixos.org. nixpkgs' Hydra does not build cross
#   Qt, so nobody upstream will ever fill it for us. (Those probes predate the
#   move to Attic and were NOT re-run against it -- see the note above.)
#
#   Consequence: without priming, EVERY Windows job in EVERY repo builds that
#   stack from source, concurrently, and none of them can help each other
#   because nothing lands in the cache until a job finishes. 18 eligible repos
#   x hours each, on the first push. That is the failure mode this workflow
#   exists to prevent, and it is why windows-ci.yml refuses to start a build
#   over its derivation budget instead of trying.
#
# WHY IT IS STAGED RATHER THAN A FLAT MATRIX
#   Parallel legs do not share a store. A flat matrix over the six packages
#   would have five legs rebuild qtbase. Stage 1 builds and pushes the base;
#   stages 2 and 3 then substitute it. Each stage gets its own 6 h budget, which
#   is the only way this fits inside GitHub's per-job ceiling at all.
#
# IF STAGE 1 STILL DOES NOT FIT
#   qtbase alone has never been built to completion in this project -- the one
#   attempt ran ~6.5 h under emulation and had not started it. If stage 1 times
#   out, CI cannot prime this cache and a human must seed it once from a real
#   x86_64-linux machine:
#       nix build github:logos-co/logos-nix#legacyPackages.x86_64-linux.pkgsWindows.qt6.qtbase
#       attic login logos https://cache.nix.logos.co <token>
#       attic push logos:public ./result
#   (the attic invocation is written from its documented interface and has NOT
#   been run here; the cachix form it replaces had not been run either.)
#   after which this workflow keeps it warm and the manual step never recurs.

on:
  workflow_dispatch:
  schedule:
    # Weekly, to re-fill after cache GC and after a nixpkgs-windows bump.
    - cron: '0 3 * * 1'
  push:
    branches: [master]
    paths:
      - 'flake.lock'
      - 'nix/windows/**'

concurrency:
  group: windows-cache-prime
  cancel-in-progress: false

jobs:
  base:
    name: 'stage 1: icu4c, boost, qtbase'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: logos-co/logos-windows-ci/.github/actions/nix-setup@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          github-token: ${{ github.token }}
          free-disk-space: 'true'
      - run: |
          set -euo pipefail
          W=.#legacyPackages.x86_64-linux.pkgsWindows
          nix build -L "$W.icu" "$W.boost" "$W.qt6.qtbase" --no-link

  qt-modules:
    name: 'stage 2: the rest of Qt'
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: logos-co/logos-windows-ci/.github/actions/nix-setup@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          github-token: ${{ github.token }}
          free-disk-space: 'true'
      - run: |
          set -euo pipefail
          W=.#legacyPackages.x86_64-linux.pkgsWindows
          nix build -L "$W.qt6.qtdeclarative" "$W.qt6.qtsvg" \
                       "$W.qt6.qtremoteobjects" --no-link

  apps:
    name: 'stage 3: the deepest Logos closures'
    needs: qt-modules
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: logos-co/logos-windows-ci/.github/actions/nix-setup@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          github-token: ${{ github.token }}
          free-disk-space: 'true'
      - name: Build the two closures that between them cover everything else
        run: |
          set -euo pipefail
          # Measured with `nix build --dry-run`: logoscore-cli's `cli` is 100
          # derivations / 684 paths / 999 MiB and liblogos' `portable` is 95 —
          # the union is a superset of what every other Windows target needs.
          # Building these two primes the whole fleet.
          nix build -L --no-link \
            'github:logos-co/logos-logoscore-cli#packages.x86_64-windows.cli' \
            'github:logos-co/logos-liblogos#packages.x86_64-windows.portable'
      - name: Report what is now cached
        run: |
          set -euo pipefail
          # Probe the cache for the paths we just pushed. A green build that
          # pushed nothing looks identical to one that pushed everything, right
          # up until the next job rebuilds Qt from source, so ask the cache.
          #
          # Attic, not cachix: nix-setup pushes to cache.nix.logos.co now, and a
          # probe left pointing at logos-co.cachix.org would fail EVERY run
          # against a cache nothing writes to any more. The `public` cache is
          # the one this workflow fills, because it only runs on master /
          # schedule / dispatch and the org action selects `public` there.
          # URL shape verified against the live endpoint: /public/<hash>.narinfo
          # returns 404 for an absent well-formed hash (and /public/nix-cache-info
          # returns 200), so a non-200 here means absent rather than misaddressed.
          ATTRS=(
            'github:logos-co/logos-logoscore-cli#packages.x86_64-windows.cli'
            'github:logos-co/logos-liblogos#packages.x86_64-windows.portable'
          )
          miss=0
          {
            echo "### Windows cache primed"
            for a in "${ATTRS[@]}"; do
              p=$(nix eval --raw "$a.outPath")
              h=$(basename "$p" | cut -d- -f1)
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                       "https://cache.nix.logos.co/public/$h.narinfo")
              echo "- \`$a\` → HTTP $code"
              [ "$code" = 200 ] || miss=1
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$miss" -ne 0 ]; then
            echo "::error::a path this job built is NOT in the Logos public cache."
            echo "::error::The push failed or ATTIC_TOKEN_PUBLIC is absent — priming did not"
            echo "::error::happen, and every Windows job will still start from source."
            echo "::error::On master that secret lives in the public-cache environment; a job"
            echo "::error::that does not enter it resolves the token to empty and SKIPS the"
            echo "::error::push rather than failing, which is exactly this symptom."
            exit 1
          fi
