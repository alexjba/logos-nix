name: Windows (cross)

# Reusable Windows CI for every Logos repo that has an x86_64-windows target.
#
# THE SHAPE, AND WHY
#   Nix does not run on Windows. The only Nix on a Windows box is inside WSL2,
#   which is Linux and produces ELF -- logos-libp2p-module currently burns a
#   windows-latest runner plus a WSL install plus a cold Nix bootstrap on every
#   run to build and test x86_64-linux binaries, which proves nothing about
#   Windows. A Windows BUILD is therefore a cross build on an ordinary
#   ubuntu-latest runner; RUNNING the result is a separate job on a real
#   windows-latest runner, fed by an artifact. That hand-off is the whole design.
#
#   wine runs on the Linux side as a cheap pre-filter (it substitutes in ~45 s,
#   needs no display and no privileges). It is necessary-but-not-sufficient:
#   wine's DLL-search and window-message semantics diverge from Windows exactly
#   where this project's two hardest bugs lived (LOAD_WITH_ALTERED_SEARCH_PATH;
#   QProcess::terminate on a windowless Qt child), so the native leg is the one
#   that counts and wine only buys a faster red.
#
# THE COST MODEL, WHICH THE CALLER DOES NOT GET TO IGNORE
#   The mingw *toolchain* is cached upstream (cache.nixos.org, 200). The mingw
#   *Qt* stack is not, in either cache -- qtbase, qtdeclarative, qtsvg,
#   qtremoteobjects, icu4c and boost were all measured 404 in both. Building
#   that from source is hours, and GitHub's ceiling is 6 h. So this workflow
#   REFUSES to start a cold Qt build (see the derivation-budget step) rather
#   than time out after four hours in a way nobody can read. Prime the cache
#   once, from logos-nix's windows-cache-prime.yml, before enabling any
#   Qt-dependent caller.

on:
  workflow_call:
    inputs:
      targets:
        description: >
          Whitespace-separated attribute names under `packages.x86_64-windows`.
          Each becomes a subdirectory of the staged tree, so a smoke script
          refers to `<target>/bin/foo.exe`.
        type: string
        required: false
        default: default
      smoke:
        description: >
          bash script run against the staged tree, on BOTH wine and a real
          windows-latest runner, from the tree root. Invoke PEs through the
          `run` wrapper on PATH -- it is `exec wine "$@"` on Linux and
          `exec "$@"` on Windows, so ONE script serves both legs. `$STAGE_ABS`
          is the tree root spelled the way the PE will see it (a `Z:` path under
          wine, a drive path on Windows). Empty means COMPILE-ONLY -- allowed,
          but reported as a coverage gap, not as a pass.
        type: string
        required: false
        default: ''
      native-smoke:
        description: Run `smoke` on a real windows-latest runner. Free on public repos.
        type: boolean
        required: false
        default: true
      wine-smoke:
        description: Run `smoke` under wine on the Linux builder first, for a faster red.
        type: boolean
        required: false
        default: true
      min-pes:
        description: Floor on staged .exe/.dll count. 0 only with min-archives >= 1.
        type: number
        required: false
        default: 1
      min-archives:
        description: Floor on staged mingw COFF .a count, for headers+static-lib repos.
        type: number
        required: false
        default: 0
      lgx-variant:
        description: Assert each staged .lgx has a real variants/windows-x86_64 payload.
        type: boolean
        required: false
        default: false
      assemble:
        description: JSON widening the import search path for multi-derivation apps.
        type: string
        required: false
        default: '{}'
      cold-derivation-budget:
        description: >
          Fail fast rather than start a build larger than this many derivations.
          30 comfortably covers a warm-cache incremental (measured: the whole of
          logoscore-cli's Windows CLI is 100 derivations cold, 24 for
          logos-module's `bin`, single digits once the shared closure is cached).
        type: number
        required: false
        default: 30
      timeout-minutes:
        type: number
        required: false
        default: 60
      submodules:
        type: string
        required: false
        default: 'false'
      extra-nix-args:
        description: Appended to every `nix build`/`nix eval` (e.g. --override-input pairs).
        type: string
        required: false
        default: ''

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      smoke: ${{ inputs.smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.submodules }}

      - uses: logos-co/logos-nix/.github/actions/nix-setup@v1
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          github-token: ${{ github.token }}
          free-disk-space: 'true'

      # ------------------------------------------------------------------
      # Anti-silent-skip. A matrix leg that has nothing to do is worse than no
      # leg at all: it is a permanent green that means nothing. 23 of the 45
      # repos with linux+macOS CI have no x86_64-windows attribute whatsoever,
      # so this is the single most likely way this design gets misapplied.
      # ------------------------------------------------------------------
      - name: Resolve targets (fails loudly if the repo has no Windows output)
        id: targets
        run: |
          set -euo pipefail
          read -r -a TARGETS <<< "${{ inputs.targets }}"
          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "::error::no targets given"; exit 1
          fi
          if ! nix eval --raw '.#packages.x86_64-windows' --apply 'x: "ok"' \
                ${{ inputs.extra-nix-args }} >/dev/null 2>err.log; then
            echo "::error::this repo exposes no packages.x86_64-windows."
            echo "::error::Do not add this workflow to a repo without a Windows target."
            echo "::error::For a module repo, the port is usually a logos-module-builder bump — nothing else."
            sed -n '1,20p' err.log
            exit 1
          fi
          have=$(nix eval --raw '.#packages.x86_64-windows' \
                   --apply 'x: builtins.concatStringsSep " " (builtins.attrNames x)' \
                   ${{ inputs.extra-nix-args }})
          echo "repo exposes: $have"
          ATTRS=()
          for t in "${TARGETS[@]}"; do
            case " $have " in
              *" $t "*) ;;
              *) echo "::error::requested target '$t' is not in packages.x86_64-windows ($have)"; exit 1 ;;
            esac
            ATTRS+=(".#packages.x86_64-windows.$t")
          done
          printf '%s\n' "${ATTRS[@]}" > attrs.txt
          printf '%s\n' "${TARGETS[@]}" > targets.txt
          echo "count=${#ATTRS[@]}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # Anti-cold-build. Turns a four-hour timeout nobody can interpret into a
      # sixty-second failure that says what to do. See the header.
      # ------------------------------------------------------------------
      - name: Check the cache is primed
        run: |
          set -euo pipefail
          mapfile -t ATTRS < attrs.txt
          nix build --dry-run "${ATTRS[@]}" ${{ inputs.extra-nix-args }} \
            2> dry.log || { cat dry.log; exit 1; }
          # `nix build --dry-run` writes its plan to stderr as
          # "these N derivations will be built:" followed by one path per line.
          n=$(awk '/will be built/{f=1;next} /will be fetched|^$/{f=0} f&&/^ /{c++} END{print c+0}' dry.log)
          echo "derivations to build: $n (budget ${{ inputs.cold-derivation-budget }})"
          sed -n '1,40p' dry.log
          if [ "$n" -gt "${{ inputs.cold-derivation-budget }}" ]; then
            echo "::error::$n derivations to build exceeds the budget."
            echo "::error::This is what an unprimed mingw Qt closure looks like. Building it here"
            echo "::error::would take hours and probably hit GitHub's 6 h ceiling."
            echo "::error::Fix: run logos-nix's 'Windows cache prime' workflow, then re-run."
            echo "::error::If this repo genuinely grew that much, raise cold-derivation-budget."
            exit 1
          fi

      - name: Cross-build
        run: |
          set -euo pipefail
          mapfile -t ATTRS < attrs.txt
          # One invocation so nix parallelises the shared closure rather than
          # serialising near-identical dependency graphs.
          nix build "${ATTRS[@]}" ${{ inputs.extra-nix-args }} \
            --print-build-logs --no-link

      - name: Stage
        run: |
          set -euo pipefail
          mkdir -p stage
          while read -r t; do
            [ -n "$t" ] || continue
            out=$(nix build --no-link --print-out-paths \
                    ".#packages.x86_64-windows.$t" ${{ inputs.extra-nix-args }} | head -1)
            mkdir -p "stage/$t"
            cp -rL "$out"/. "stage/$t"/
          done < targets.txt
          chmod -R u+w stage
          find stage -type f | wc -l

      - uses: logos-co/logos-nix/.github/actions/windows-gates@v1
        with:
          stage-dir: stage
          min-pes: ${{ inputs.min-pes }}
          min-archives: ${{ inputs.min-archives }}
          lgx-variant: ${{ inputs.lgx-variant }}
          assemble: ${{ inputs.assemble }}

      - name: Record the coverage this run actually bought
        run: |
          {
            echo "### Windows (cross)"
            echo "- targets: \`${{ inputs.targets }}\`"
            echo "- staged PEs: $(find stage -name '*.exe' -o -name '*.dll' | wc -l)"
            if [ -z "${{ inputs.smoke }}" ]; then
              echo "- runtime coverage: **NONE — compile-and-inspect only.**"
              echo "  Nothing in this repo was executed on Windows. Add a \`smoke:\` script."
            else
              echo "- runtime coverage: wine=${{ inputs.wine-smoke }} native=${{ inputs.native-smoke }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${{ inputs.smoke }}" ]; then
            echo "::warning::compile-only: no Windows binary from this repo was executed."
          fi

      # The WHOLE staged tree, unfiltered. Both smoke legs run against this
      # artifact rather than against their own copy, so if they disagree it is a
      # genuine wine-vs-Windows divergence and not a staging difference.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-${{ github.event.repository.name }}
          path: stage/
          if-no-files-found: error
          retention-days: 7

  wine-smoke:
    needs: cross-build
    if: inputs.smoke != '' && inputs.wine-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64-${{ github.event.repository.name }}
          path: stage
      - uses: logos-co/logos-nix/.github/actions/nix-setup@v1
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - name: Smoke (wine)
        working-directory: stage
        run: |
          set -euo pipefail
          # Fully substituted from cache.nixos.org: ~53 MiB, 0 derivations built.
          WINE=$(nix build --no-link --print-out-paths nixpkgs#wine64Packages.minimal)/bin/wine
          export WINEPREFIX="$RUNNER_TEMP/wineprefix" WINEDEBUG=-all
          export WINEDLLOVERRIDES="mscoree,mshtml="
          unset DISPLAY DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR
          # upload-artifact does not preserve the executable bit.
          chmod -R u+rwX .
          # The `run` wrapper is what lets one smoke script serve both legs.
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec %s "$@"\n' "$WINE" > "$RUNNER_TEMP/bin/run"
          chmod +x "$RUNNER_TEMP/bin/run"
          export PATH="$RUNNER_TEMP/bin:$PATH" STAGE_ABS="Z:$PWD"
          bash -euo pipefail -c '${{ inputs.smoke }}'

  native-smoke:
    needs: cross-build
    if: inputs.smoke != '' && inputs.native-smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64-${{ github.event.repository.name }}
          path: stage
      - name: Smoke (real Windows)
        working-directory: stage
        shell: bash
        run: |
          set -euo pipefail
          # This is the only place in the entire org where a Nix-built PE is
          # executed by Windows. Nothing is installed: the import-closure gate
          # in cross-build already proved every non-system DLL ships in the tree,
          # so a stock windows-latest image is sufficient.
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec "$@"\n' > "$RUNNER_TEMP/bin/run"
          chmod +x "$RUNNER_TEMP/bin/run"
          export PATH="$RUNNER_TEMP/bin:$PATH" STAGE_ABS="$(pwd -W)"
          bash -euo pipefail -c '${{ inputs.smoke }}'
