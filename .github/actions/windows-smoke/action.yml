name: Windows smoke
description: >
  Run a caller's smoke script against a staged Windows tree -- byte-identically
  on wine (ubuntu-latest) and on a real windows-latest runner. It lives in an
  action rather than twice in windows-ci.yml for two reasons. The legs are only
  comparable if they run the SAME harness, and a harness duplicated in two YAML
  blocks stays identical only by discipline. And a script embedded in YAML is
  invisible to shellcheck: actionlint substitutes a placeholder for `${{ }}`
  before linting, which is precisely how `[ -z "${{ inputs.smoke }}" ]` shipped
  in an earlier revision of this design and lint-cleanly turned a good build red
  on the first caller whose smoke script contained a double quote.

inputs:
  smoke:
    description: >
      bash script, run from the staged tree ROOT. The root holds one directory
      per target, so every path begins with the target name --
      `run lgx/bin/lgx.exe --help`, not `run bin/lgx.exe --help`.
    required: true
  stage-dir:
    description: Directory the artifact was downloaded into.
    required: false
    default: stage
  wine:
    description: >
      'true' to launch every PE through wine (the Linux pre-filter leg), 'false'
      to exec it directly (the real-Windows leg). This is the ONLY difference
      between the two legs.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # ----------------------------------------------------------------------
    # The upload/download hop is the one link in this chain nobody has ever
    # observed end to end. Assert it instead of assuming it: the builder wrote
    # pe-manifest.txt next to the tree, so re-count here and diff.
    # ----------------------------------------------------------------------
    - name: Verify the artifact survived the round trip
      shell: bash
      working-directory: ${{ inputs.stage-dir }}
      run: |
        set -euo pipefail
        if [ ! -f pe-manifest.txt ]; then
          echo "::error::pe-manifest.txt is missing from the downloaded artifact."
          echo "::error::The builder writes it into the tree root immediately before upload."
          echo "::error::If it is absent, the artifact is not the one this workflow produced"
          echo "::error::-- or upload-artifact dropped it (it excludes hidden files, which is"
          echo "::error::why this file is NOT dot-prefixed)."
          find . -type f | head -50
          exit 1
        fi
        # A FLOOR, for the same reason windows-gates refuses min-pes: 0 with
        # min-archives: 0 and says so in its own description. Without it an
        # empty tree carrying an empty manifest satisfies every check below --
        # the two files are equal, both empty -- and this step printed
        # "artifact round trip verified: 0 PEs" and exited 0, after which the
        # smoke script ran against nothing. Two comparisons that agree on
        # emptiness are not evidence that anything arrived.
        n=$(wc -l < pe-manifest.txt | tr -d '[:space:]')
        if [ "$n" -lt 1 ]; then
          # One shape legitimately stages no LOOSE PE: a repo whose Windows
          # artifact is a .lgx, whose PEs live inside the archive and were
          # gated there on the builder. Anything else with an empty manifest is
          # an empty artifact.
          nlgx=$(find . -name '*.lgx' -type f | wc -l | tr -d '[:space:]')
          if [ "$nlgx" -lt 1 ]; then
            echo "::error::the manifest lists ZERO PEs and the tree holds no .lgx either."
            echo "::error::There is nothing here to verify and nothing for the smoke script"
            echo "::error::to execute. Check the builder's Stage step: an install rule that"
            echo "::error::copied nothing exits 0 too."
            find . -type f | head -50
            exit 1
          fi
          echo "no loose PEs; artifact carries $nlgx .lgx (payload gated on the builder)"
        fi
        find . -type f \( -name '*.exe' -o -name '*.dll' \) \
          | sed 's|^\./||' | LC_ALL=C sort > arrived.txt
        # Compared in the shell, NOT with diff. `diff` is absent from some
        # Windows bash installs, and `if ! diff a b` cannot tell "the files
        # differ" from "diff is not installed" -- it reports a missing tool as a
        # corrupted artifact. Measured: this check failed exactly that way on a
        # Windows box whose artifact was in fact byte-perfect.
        if [ "$(cat pe-manifest.txt)" != "$(cat arrived.txt)" ]; then
          echo "::error::the PE set changed between upload and download."
          echo "::error::A PE that vanishes here reappears later as a silent load failure."
          grep -Fxv -f arrived.txt pe-manifest.txt \
            | sed 's/^/::error::  LOST in transit: /' || true
          grep -Fxv -f pe-manifest.txt arrived.txt \
            | sed 's/^/::error::  APPEARED from nowhere: /' || true
          exit 1
        fi
        [ "$n" -eq 0 ] || echo "artifact round trip verified: $n PEs"
        rm -f arrived.txt

    - name: Smoke
      shell: bash
      working-directory: ${{ inputs.stage-dir }}
      env:
        # Via env, never interpolated into the script text. See the description.
        SMOKE: ${{ inputs.smoke }}
        WINE: ${{ inputs.wine }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/bin"
        cp "$GITHUB_ACTION_PATH/run" "$RUNNER_TEMP/bin/run"
        chmod +x "$RUNNER_TEMP/bin/run"
        export PATH="$RUNNER_TEMP/bin:$PATH"

        if [ "$WINE" = 'true' ]; then
          # Fully substituted from cache.nixos.org: ~53 MiB, 0 derivations built.
          RUN_EXEC=$(nix build --no-link --print-out-paths nixpkgs#wine64Packages.minimal)/bin/wine
          export RUN_EXEC
          export WINEPREFIX="$RUNNER_TEMP/wineprefix" WINEDEBUG=-all
          export WINEDLLOVERRIDES="mscoree,mshtml="
          unset DISPLAY DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR
          # There was a `chmod -R u+rwX .` here, with a comment claiming
          # upload-artifact drops the executable bit and wine needs it back.
          # Both halves are wrong, measured: the builder's Stage step uses
          # `cp -rL --no-preserve=mode`, which drops the store's 0555 to
          # 0644/0664 (whatever the runner's umask gives), so NO staged file
          # has an execute bit -- and `u+X` adds `x` only to files that ALREADY
          # have one. Measured on a real staged tree: 0 of 3 files executable
          # before the chmod, 0 of 3 after; plain `u+x` would have changed it.
          # The line could never restore a bit on a single PE. And wine does not want
          # one: it loads the PE itself, `run` tests `-f` rather than `-x`, and
          # a 0664 lgx.exe ran fine under wine. An inert line with a false
          # comment is worse than no line: it is a load-bearing-looking step
          # that would go on being copied.
          # wine maps the whole unix filesystem at Z:.
          export STAGE_ABS="Z:$PWD"
        else
          export RUN_EXEC=""
          # Assigning inside `export` masks the command's exit status (SC2155):
          # on a bash whose `pwd` has no -W -- anything but MSYS/Git-Bash -- the
          # substitution fails, `export` succeeds, and STAGE_ABS is silently
          # empty for the rest of the run under `set -e`. Split so it fails.
          if ! STAGE_ABS=$(pwd -W 2>/dev/null) || [ -z "$STAGE_ABS" ]; then
            echo "::error::\`pwd -W\` produced nothing on the native leg."
            echo "::error::\$STAGE_ABS must be the tree root as the PE sees it (a drive path),"
            echo "::error::and -W is how an MSYS/Git-Bash tells you one. This step must run"
            echo "::error::under the windows-latest runner's default \`shell: bash\`."
            echo "::error::pwd=$(pwd)  SHELL=${SHELL:-<unset>}  OSTYPE=${OSTYPE:-<unset>}"
            exit 1
          fi
          export STAGE_ABS
        fi
        echo "cwd=$(pwd)  STAGE_ABS=$STAGE_ABS  RUN_EXEC=${RUN_EXEC:-<direct exec>}"
        echo "staged targets: $(find . -mindepth 1 -maxdepth 1 -type d | sed 's|^\./||' | sort | tr '\n' ' ')"

        printf '%s\n' "$SMOKE" > "$RUNNER_TEMP/smoke.sh"
        bash -euo pipefail "$RUNNER_TEMP/smoke.sh"
